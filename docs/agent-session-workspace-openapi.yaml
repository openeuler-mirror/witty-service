          type: string
          title: System Prompt
        expected_config_updated_at:
          type: string
          format: date-time
          title: Expected Config Updated At
          description: 读取时的 config_updated_at；不一致返回 409 CONFIG_UPDATE_CONFLICT
      additionalProperties: false
      type: object
      required:
      - name
      - description
      - system_prompt
      - expected_config_updated_at
      title: UpdateAgentRequest
      description: 整份编辑定义字段；来源是创建事实，编辑不改变来源。
    UpdateSessionMcpActivationsRequest:
      properties:
        activations:
          items:
            $ref: '#/components/schemas/McpActivationUpdate'
