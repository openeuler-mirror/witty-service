      required:
      - items
      - next_before
      title: MessageListResponse
    MessageResponse:
      properties:
        id:
          type: string
          title: Id
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        attribution:
          anyOf:
          - $ref: '#/components/schemas/MessageAttribution'
          - type: 'null'
          description: 所属回合的归因；消息尚未关联回合时为 null
        parts:
          items:
            oneOf:
            - $ref: '#/components/schemas/TextMessagePart'
            - $ref: '#/components/schemas/ReasoningMessagePart'
            - $ref: '#/components/schemas/ToolMessagePart'
            - $ref: '#/components/schemas/FileMessagePart'
            discriminator:
              propertyName: type
              mapping:
                file: '#/components/schemas/FileMessagePart'
                reasoning: '#/components/schemas/ReasoningMessagePart'
                text: '#/components/schemas/TextMessagePart'
                tool: '#/components/schemas/ToolMessagePart'
          type: array
          title: Parts
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - role
      - parts
      - created_at
      title: MessageResponse
      description: 只投影 text/reasoning/tool/file；Runtime 的 step 等未知 part 由投影层丢弃。
    ModelRef:
      properties:
        id:
          type: string
          title: Id
        display_name:
          type: string
          title: Display Name
        provider_id:
          type: string
          title: Provider Id
        provider_model_id:
          type: string
          title: Provider Model Id
        enabled:
          type: boolean
          title: Enabled
          description: 模型已启用；已有 Session 仍保留该选择，但新 Turn 返回 409
      type: object
      required:
      - id
      - display_name
      - provider_id
      - provider_model_id
      - enabled
      title: ModelRef
    ReasoningMessagePart:
      properties:
        type:
          type: string
          const: reasoning
          title: Type
          default: reasoning
        text:
          type: string
          title: Text
      type: object
      required:
      - text
      title: ReasoningMessagePart
    SessionListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SessionResponse'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: 下一页游标；null 表示没有更多
      type: object
      required:
      - items
      - next_cursor
      title: SessionListResponse
    SessionMcpActivationItem:
      properties:
        mcp_server_id:
          type: string
          title: Mcp Server Id
        name:
          type: string
          title: Name
        active:
          type: boolean
          title: Active
          description: 本会话是否允许向后续回合暴露该 MCP 工具
        enabled:
          type: boolean
          title: Enabled
          description: 全局目录开关；disabled 优先于本会话激活
        connection_status:
          type: string
          enum:
          - ready
          - connecting
          - degraded
          - disabled
          title: Connection Status
          description: Workspace 内该 MCP 的连接状态；只有 ready 的工具进入本轮可用集合
      type: object
      required:
      - mcp_server_id
      - name
      - active
      - enabled
      - connection_status
      title: SessionMcpActivationItem
    SessionMcpActivationListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/SessionMcpActivationItem'
          type: array
          title: Items
      type: object
      required:
      - items
      title: SessionMcpActivationListResponse
    SessionResponse:
      properties:
        id:
          type: string
          title: Id
        workspace_id:
          type: string
          title: Workspace Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        pinned:
          type: boolean
          title: Pinned
        origin:
          type: string
          pattern: ^(?:web|scheduled|channel:[A-Za-z0-9_.-]+)$
          title: Origin
          description: 会话来源：web、scheduled 或 channel:<渠道标识符>
        scheduled_task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scheduled Task Id
        current_agent:
          $ref: '#/components/schemas/AgentRef'
        current_model:
          anyOf:
          - $ref: '#/components/schemas/ModelRef'
          - type: 'null'
          description: 当前模型；null 表示系统没有可用模型（未配置或全部禁用），不是加载中，也不是用户主动清空；此时创建 Turn 返回 400 MODEL_REQUIRED
        active_turn:
          anyOf:
          - $ref: '#/components/schemas/TurnSummary'
          - type: 'null'
          description: 该会话当前 running 的回合；没有则为 null
        runtime_status:
          type: string
          enum:
          - stopped
          - starting
          - ready
          - restarting
          - unavailable
          title: Runtime Status
          description: Runtime 可用性；ready 对应 ADR 的 healthy，不是完整进程状态机；非 ready 时历史与产物读取返回 503
        last_activity_at:
          type: string
          format: date-time
          title: Last Activity At
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - workspace_id
      - pinned
      - origin
      - current_agent
      - current_model
      - runtime_status
      - last_activity_at
      - created_at
      - updated_at
      title: SessionResponse
    TextInputPart:
      properties:
        type:
          type: string
          const: text
          title: Type
        text:
          type: string
          minLength: 1
          title: Text
      additionalProperties: false
      type: object
      required:
      - type
      - text
      title: TextInputPart
    TextMessagePart:
      properties:
        type:
          type: string
          const: text
          title: Type
