      description: 本轮用量（跨 step 累计）；缺项为 null，避免前端显示假 0。
    UpdateAgentRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 2000
          title: Description
