      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        sandbox_type:
          type: string
          enum:
          - local_process
          - docker
          title: Sandbox Type
        is_default:
          type: boolean
          title: Is Default
        default_agent:
          $ref: '#/components/schemas/AgentRef'
        default_model:
          anyOf:
          - $ref: '#/components/schemas/ModelRef'
          - type: 'null'
        session_count:
          type: integer
          title: Session Count
        runtime_status:
          type: string
          enum:
          - stopped
          - starting
          - ready
          - restarting
          - unavailable
          title: Runtime Status
          description: Runtime 可用性；ready 对应 ADR 的 healthy，不是完整进程状态机；非 ready 时历史与产物读取返回 503
        runtime_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Reason
