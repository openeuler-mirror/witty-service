          description: true 表示该回合已处于终态，本次 abort 未产生副作用；重复 abort 仍返回 200
      type: object
      required:
      - turn
      - already_stopped
      title: AbortTurnResponse
      examples:
      - already_stopped: true
        turn:
          agent:
            id: agt_01
            name: Primary
          created_at: '2026-11-09T07:30:00.000Z'
          finished_at: '2026-11-09T07:30:05.000Z'
          id: trn_02
          model:
            display_name: DeepSeek V3
            id: mdl_01
          session_id: ses_01
          started_at: '2026-11-09T07:30:00.000Z'
          status: interrupted
          turn_seq: 3
    AgentListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentSummary'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: 下一页游标；null 表示没有更多
      type: object
      required:
      - items
      - next_cursor
      title: AgentListResponse
    AgentRef:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        kind:
          type: string
          enum:
          - primary
          - expert
          title: Kind
        archived:
          type: boolean
          title: Archived
          description: Agent 已归档；已有 Session 仍保留该选择，但新 Turn 返回 409
      type: object
      required:
      - id
      - name
      - kind
      - archived
      title: AgentRef
    AgentResponse:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          enum:
          - primary
          - expert
          title: Kind
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        source_type:
          type: string
          enum:
          - local
          - market
          - preset
          title: Source Type
        source_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Ref
        archived_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archived At
        config_updated_at:
          type: string
          format: date-time
          title: Config Updated At
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        system_prompt:
          type: string
          title: System Prompt
      type: object
      required:
      - id
      - kind
      - name
      - description
      - source_type
      - config_updated_at
      - created_at
      - updated_at
      - system_prompt
      title: AgentResponse
    AgentSummary:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          enum:
          - primary
          - expert
          title: Kind
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        source_type:
          type: string
          enum:
          - local
          - market
          - preset
          title: Source Type
        source_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Ref
        archived_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archived At
        config_updated_at:
          type: string
          format: date-time
          title: Config Updated At
