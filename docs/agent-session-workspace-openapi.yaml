        call_id:
          type: string
          title: Call Id
        name:
          type: string
          title: Name
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - error
          title: Status
        input:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Input
        output:
          title: Output
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - call_id
      - name
      - status
      title: ToolMessagePart
    TurnAgentAttribution:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
          description: 回合准入时固定的 Agent 展示名
      type: object
      required:
      - id
      - name
      title: TurnAgentAttribution
    TurnError:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: TurnError
    TurnListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TurnResponse'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: 下一页游标；null 表示没有更多
      type: object
      required:
      - items
      - next_cursor
      title: TurnListResponse
    TurnModelAttribution:
      properties:
        id:
          type: string
          title: Id
        display_name:
          type: string
          title: Display Name
          description: 回合准入时固定的模型展示名
      type: object
      required:
      - id
      - display_name
      title: TurnModelAttribution
    TurnResponse:
      properties:
        id:
          type: string
          title: Id
        session_id:
          type: string
          title: Session Id
        turn_seq:
          type: integer
          minimum: 1.0
          title: Turn Seq
        status:
          type: string
          enum:
          - running
          - completed
          - error
          - interrupted
          title: Status
        agent:
          $ref: '#/components/schemas/TurnAgentAttribution'
        model:
          $ref: '#/components/schemas/TurnModelAttribution'
        usage:
          anyOf:
          - $ref: '#/components/schemas/TurnUsage'
          - type: 'null'
          description: 本轮用量；未产生用量时为 null
        error:
          anyOf:
          - $ref: '#/components/schemas/TurnError'
          - type: 'null'
        started_at:
          type: string
          format: date-time
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - session_id
      - turn_seq
      - status
      - agent
      - model
      - started_at
      - created_at
      title: TurnResponse
    TurnSummary:
      properties:
        id:
          type: string
          title: Id
        turn_seq:
          type: integer
          minimum: 1.0
          title: Turn Seq
        status:
          type: string
          enum:
          - running
          - completed
          - error
          - interrupted
          title: Status
      type: object
      required:
      - id
      - turn_seq
      - status
      title: TurnSummary
    TurnUsage:
      properties:
        input_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Input Tokens
        output_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Output Tokens
        total_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Total Tokens
        cache_read_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Cache Read Tokens
        cache_write_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Cache Write Tokens
        reasoning_tokens:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Reasoning Tokens
        total_cost:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Total Cost
