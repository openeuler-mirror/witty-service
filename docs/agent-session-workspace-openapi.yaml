  /api/sessions/{session_id}/events:
    get:
      tags:
      - events
      summary: Stream Session Events
      operationId: stream_session_events_api_sessions__session_id__events_get
      security:
      - bearerAuth: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: 'SSE 事件流；每条为 `data: <SessionEvent JSON>`，不使用 `id:`/`event:`/`retry:`；客户端用 fetch
            + Bearer 读取'
          content:
            text/event-stream:
              schema:
                description: |-
                  SSE 事件信封（`GET /api/sessions/{id}/events`）。

                  帧格式固定为 `data: <SessionEvent JSON>\n\n`，不使用 SSE 的 `id:`、`event:`
                  或 `retry:`，也不支持 `Last-Event-ID`。断线后服务端发送 `resync_required`，
                  客户端全量重读回合与历史。客户端用 fetch 读取并携带 Bearer，不支持原生
                  `EventSource`。

                  P0 不提供 HITL，不产生 `question.*` 事件；旧 Console/Channel 的提问入口随
                  U03/U09 删除。payload 的具体形状由 C04 定义，见 `x-payload-schema`。
                properties:
                  event_id:
                    description: '事件 ID；不是 SSE 的 id: 字段'
                    title: Event Id
                    type: string
                  type:
                    description: 事件类型；已知类型见 x-event-types
                    title: Type
                    type: string
                  session_id:
                    title: Session Id
                    type: string
                  turn_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Turn Id
                  message_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: 关联的消息 ID；Delta 与完成事件有值
                    title: Message Id
                  occurred_at:
                    format: date-time
                    title: Occurred At
                    type: string
                  payload:
                    additionalProperties: true
                    title: Payload
                    type: object
                    x-payload-schema: C04
                required:
                - event_id
                - type
                - session_id
                - occurred_at
                - payload
                title: SessionEvent
                type: object
                x-event-types:
                - turn.updated
                - message.delta
                - message.completed
                - session.usage
                - thinking.delta
                - tool.call.started
                - tool.call.delta
                - tool.call.response
                - artifact.started
                - artifact.delta
                - artifact.completed
                - runtime.status
                - resync_required
                x-unsupported-event-types:
                - question.*
        '401':
          description: 缺少或错误的 Bearer token
          headers:
            WWW-Authenticate:
              description: Bearer challenge
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 目标资源不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Runtime 或配置发布暂不可用，可稍后重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
