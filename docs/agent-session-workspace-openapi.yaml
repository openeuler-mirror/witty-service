    CreateAgentRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
        system_prompt:
          type: string
          title: System Prompt
          default: ''
      additionalProperties: false
      type: object
      required:
      - name
      title: CreateAgentRequest
      description: |-
        创建 Expert Agent Definition；Primary 由系统种子创建。

        来源（local/market/preset 及引用）是服务端安装事实，由服务端写入，不接受
        客户端指定。
    CreateSessionRequest:
      properties:
        workspace_id:
          type: string
          minLength: 1
          title: Workspace Id
        title:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Title
        agent_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Agent Id
          description: 省略或 null 时使用 Workspace 默认 Agent
        model_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Model Id
          description: 省略或 null 时使用 Workspace 默认模型；默认模型也为空时，Session 初始无模型，不会自动选择可用模型
      additionalProperties: false
      type: object
      required:
      - workspace_id
      title: CreateSessionRequest
      description: 只创建 web 来源的 Session；channel/scheduled 来源由进程内入口写入。
    CreateTurnRequest:
      properties:
        parts:
          items:
            oneOf:
            - $ref: '#/components/schemas/TextInputPart'
            - $ref: '#/components/schemas/FileInputPart'
            discriminator:
              propertyName: type
              mapping:
                file: '#/components/schemas/FileInputPart'
                text: '#/components/schemas/TextInputPart'
          type: array
          minItems: 1
          title: Parts
      additionalProperties: false
      type: object
      required:
      - parts
      title: CreateTurnRequest
    CreateWorkspaceRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        host_directory:
          type: string
          maxLength: 4096
          minLength: 1
          title: Host Directory
          description: 主机上已存在的绝对目录。服务端解析 realpath 后保存，创建后不可修改；该路径不属于响应契约，不在任何响应中返回。
        sandbox_type:
          type: string
          enum:
          - local_process
          - docker
          title: Sandbox Type
          default: local_process
        default_agent_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Default Agent Id
          description: 省略或 null 时使用未归档 Primary
        default_model_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Default Model Id
          description: 省略或 null 时使用全局默认模型；没有可用模型时为空
      additionalProperties: false
      type: object
      required:
      - name
      - host_directory
      title: CreateWorkspaceRequest
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - INVALID_WORKSPACE_PATH
      - MODEL_REQUIRED
      - INVALID_CURSOR
      - CURSOR_SESSION_MISMATCH
      - UNAUTHORIZED
      - WORKSPACE_NOT_FOUND
      - SESSION_NOT_FOUND
      - TURN_NOT_FOUND
      - AGENT_NOT_FOUND
      - MODEL_NOT_FOUND
      - MCP_SERVER_NOT_FOUND
      - ENDPOINT_NOT_FOUND
      - METHOD_NOT_ALLOWED
      - ACTIVE_TURN_CONFLICT
      - SESSION_ADMISSION_CLOSED
      - WORKSPACE_DIRECTORY_CONFLICT
      - AGENT_NAME_CONFLICT
      - CONFIG_UPDATE_CONFLICT
      - CONFIG_PROJECTION_INVALID
      - PRIMARY_AGENT_IMMUTABLE
      - AGENT_ARCHIVED
      - MODEL_DISABLED
      - INVALID_TURN_OPERATION
      - ENDPOINT_NOT_IMPLEMENTED
      - SESSION_MCP_ACTIVATION_UNSUPPORTED
      - RUNTIME_UNAVAILABLE
      - CONFIG_PUBLISH_UNAVAILABLE
      - INTERNAL_ERROR
      title: ErrorCode
    ErrorDetail:
      properties:
