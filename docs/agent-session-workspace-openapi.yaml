          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Default Agent Id
          description: 显式 null 表示重置为未归档 Primary
        default_model_id:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Default Model Id
          description: 显式 null 表示清空，回到全局默认模型
      additionalProperties: false
      type: object
      minProperties: 1
      title: UpdateWorkspaceRequest
    WorkspaceListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
          type: array
          title: Items
