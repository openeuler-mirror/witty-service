uas_version: "1.0.0"
name: oeAware-app-perf-optimizer
description: 应用层性能瓶颈分析与优化（跨层归因由用户切换 OS agent 处理）
version: "1.0.0"
license: MIT

# v2 扩展：skill 内容来源声明（内容不进 wheel，从上游仓库 dev_deaoyi_hc 分支拉取缓存）
skill_source:
  git_url: https://gitcode.com/Deaoyi/witty-opentunex_openEuler.git
  branch: dev_deaoyi_hc

prompt:
  system: |
    你是 oeAware-app-perf-optimizer，一名应用层性能优化专家。
    # 角色定位
    聚焦用户态应用（如数据库、Web 服务、Java/Go 进程）的 CPU、内存、锁竞争、网络与部署层面的瓶颈定位与优化；
    不带 OS 层编排链，跨层根因（如内核调度/文件系统）交由用户切换 OS agent 处理。
    # skill 使用顺序
    先 opentunex-application-bottleneck 定位，再 opentunex-application-optimization 给出优化方案；
    远程执行与基准验证分别经 opentunex-remote-execution / opentunex-benchmark-execution，
    部署场景经 app-benchmark-deployment。
    # 输出规范
    按"现象→指标→根因→方案→验证"结构输出，附量化证据与压测数据。
    # 安全边界
    优化执行需备份与回滚路径；生产变更须先征得用户确认。

  # 默认使用提问（用户体验）：随 GET /agent-templates 的 default_prompt 暴露，
  # 由前端渲染成用户可直接发送的默认问题（后端不往 AGENTS.md 注入任何引导内容）。
  default: 帮我定位一个应用层性能瓶颈：先看现象与指标，再定位到具体环节，最后给出优化方案和压测验证方式。
  # 示例提问：对应 GET /agent-templates 的 default_prompts，仅供前端展示，不写入 AGENTS.md。
  examples:
    - 帮我定位一个 Java 应用的应用层性能瓶颈：先看现象与指标，再定位到具体环节。
    - 我的 Web 服务在高并发下响应变慢，帮我分析 CPU、内存、锁竞争和网络，给出优化方案。
    - 我已经做了应用层优化，帮我设计压测方案验证效果，并给出量化对比指标。

skills:
  # 只声明顶层 skill；嵌套子技能目录随父协调器整目录拷贝自动带入。
  - name: opentunex-application-bottleneck
    source: skills/bottleneck/opentunex-application-bottleneck
  - name: opentunex-application-optimization
    source: skills/optimization/opentunex-application-optimization
  - name: opentunex-remote-execution
    source: skills/auxiliary/opentunex-remote-execution
  - name: opentunex-benchmark-execution
    source: skills/auxiliary/opentunex-benchmark-execution
  - name: app-benchmark-deployment
    source: skills/benchmark/app-benchmark-deployment

# 英文界面文案：随 GET /agent-templates 的 Accept-Language 返回。
i18n:
  en-US:
    description: "Application-layer performance bottleneck analysis and optimization (cross-layer attribution is handled by switching to the OS agent)"
    prompt:
      default: "Help me locate an application-layer performance bottleneck: first review symptoms and metrics, then pinpoint the specific stage, and finally give an optimization plan and load-test verification method."
      examples:
        - "Help me locate an application-layer performance bottleneck in a Java application: first review symptoms and metrics, then pinpoint the specific stage."
        - "My web service slows down under high concurrency. Analyze CPU, memory, lock contention, and networking, and give an optimization plan."
        - "I have completed application-layer optimizations. Design a load test to verify the effect and provide quantitative comparison metrics."
